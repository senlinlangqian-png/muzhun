[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "muzhun"
version = "0.7.0"
description = "Evidence-linked terminology correction and focus-aware subtitle placement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "Pillow>=11,<13", "numpy>=1.26,<3", "imageio-ffmpeg>=0.6,<1",
  "av>=14,<20", "rapidocr-onnxruntime>=1.4,<2", "faster-whisper>=1.2,<2",
  "pypinyin>=0.53,<1", "opencc-python-reimplemented>=0.1.7,<0.2"
]

[project.scripts]
muzhun = "muzhun.cli:main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muzhun = ["data/*.json", "web/*"]

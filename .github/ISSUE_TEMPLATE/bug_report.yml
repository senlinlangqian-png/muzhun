name: 安装或使用问题
description: 反馈幕准的安装、识别、位置或导出问题
body:
  - type: dropdown
    id: area
    attributes:
      label: 哪个步骤有问题？
      options:
        - 安装或启动
        - 专业术语识别或纠错
        - 字幕位置或画面遮挡
        - 歌词文字或时间
        - 导出
        - Agent Skill 调用
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 设备与版本
      description: 系统、幕准版本；使用 Agent 时附工具版本；环境检查中失败的项目。请删去私人路径。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现
      description: 操作步骤、预期结果和实际结果；是否使用内置合成示例。错词或错位请写具体时间、错误结果与应有结果，识别问题附模型名称。
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 可公开的复现材料
      description: 可选截图、短样例或错误信息。请只提交你愿意公开的材料。

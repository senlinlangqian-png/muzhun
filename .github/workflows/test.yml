name: Engine and API tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
          - os: macos-latest
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VENV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Set up Chinese font on macOS runner
        if: runner.os == 'macOS'
        run: |
          font="$RUNNER_TEMP/NotoSansCJKsc-Regular.otf"
          curl --fail --location --retry 3 --output "$font" https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          echo "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  $font" | shasum -a 256 --check
          echo "MUZHUN_FONT=$font" >> "$GITHUB_ENV"
      - run: python scripts/launch.py --install-only
      - run: '"$VENV_PYTHON" -m pip install -e ".[dev]"'
      - run: '"$VENV_PYTHON" -m unittest discover -s tests -v'
      - run: '"$VENV_PYTHON" -m muzhun.cli doctor --full'
      - run: '"$VENV_PYTHON" scripts/build_release.py'

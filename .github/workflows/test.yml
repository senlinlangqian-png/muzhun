name: Engine and API tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
          - os: macos-latest
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VENV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Set up Chinese font on macOS runner
        if: runner.os == 'macOS'
        run: |
          font="$RUNNER_TEMP/NotoSansCJKsc-Regular.otf"
          curl --fail --location --retry 3 --output "$font" https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          echo "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b  $font" | shasum -a 256 --check
          echo "MUZHUN_FONT=$font" >> "$GITHUB_ENV"
      - run: python scripts/launch.py --install-only
      - run: '"$VENV_PYTHON" -m pip install -e ".[dev]"'
      - run: '"$VENV_PYTHON" -m unittest discover -s tests -v'
      - run: '"$VENV_PYTHON" -m muzhun.cli doctor --full'
      - run: '"$VENV_PYTHON" scripts/build_release.py'
  release:
    name: Publish a new version after all platform checks
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'senlinlangqian-png/muzhun'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: muzhun-release
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check whether this version is already released
        id: version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "number=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; leaving its files unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists == 'false'
        run: python -m pip install PyYAML setuptools wheel
      - if: steps.version.outputs.exists == 'false'
        run: python scripts/build_release.py
      - name: Publish checked source, Skill, wheel and checksums
        if: steps.version.outputs.exists == 'false'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          notes="docs/release-${RELEASE_VERSION%.*}.md"
          test -f "$notes"
          gh release create "v$RELEASE_VERSION" \
            "dist/muzhun-$RELEASE_VERSION-source.zip" \
            "dist/muzhun-subtitles-skill-$RELEASE_VERSION.zip" \
            "dist/muzhun-$RELEASE_VERSION-py3-none-any.whl" \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest \
            --title "幕准 v$RELEASE_VERSION" --notes-file "$notes"

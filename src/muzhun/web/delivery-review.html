<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幕准 · 字幕交付复核</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#25362e;font:16px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px}h1{margin:0}h2{font-size:20px}p{margin:8px 0}.muted{color:#66776d}.notice{padding:14px;background:#fff4d9;border-radius:12px;margin:18px 0}video{width:100%;max-height:550px;background:#101a15;border-radius:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card,article{padding:16px;background:white;border:1px solid #dce3db;border-radius:12px;margin:12px 0}img{width:100%;border-radius:8px}button,a{color:#206047}button{border:1px solid #ccd8cc;background:#eef4eb;border-radius:8px;padding:7px 12px;cursor:pointer}.text{white-space:pre-wrap;font-size:18px}details{margin-top:10px}li{margin:7px 0}.tag{display:inline-block;padding:2px 8px;background:#fff0c9;border-radius:6px;font-size:13px;margin-right:5px}</style></head><body><main>
<h1>幕准 · 字幕交付复核</h1><p id="source" class="muted"></p><div class="notice"><strong>这是待听音复核的字幕稿。</strong><p>“待核对为零”不代表全文正确。请播放原声，检查人名、专业词、数字、单位和字幕位置。</p></div>
<video id="player" src="video.mp4" controls playsinline preload="metadata"></video><p><a href="video.mp4" download>视频</a> · <a href="subtitles.ass" download>带位置的 ASS</a> · <a href="subtitles.srt" download>文字与时间 SRT</a> · <a href="manifest.json" download>复核记录</a></p>
<p id="summary"></p><h2>从实际导出视频截取的画面</h2><div id="previews" class="cards"></div>
<h2>逐条检查</h2><p class="muted">复核标记由制作人填写，只对应这次导出的文字、时间和位置。</p><label><input id="issues" type="checkbox"> 只看未复核与待检查</label><div id="cues"></div></main>
<script type="application/json" id="data">__MUZHUN_DATA__</script><script>
"use strict";const d=JSON.parse(document.getElementById("data").textContent),$=id=>document.getElementById(id),e=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const s=d.summary;$("source").textContent="版本 "+d.version+" · 修订 "+(d.revision||0)+" · "+d.profile+" · "+(d.transcription.engine==="provided-srt"?"文字来自导入 SRT":(d.transcription.model||"未知")+" 语音识别")+" · "+(d.provenance==="synthetic-demo"?"合成演示":"用户素材");$("summary").textContent=`已人工复核 ${s.human_reviewed||0} / ${s.cues} 条 · ${s.pending} 个待核对建议 · ${s.layout_review} 条布局提示 · ${s.within_cue_changes||0} 次句内换位`;
$("previews").innerHTML=d.previews.map(p=>`<div class="card"><img src="${e(p.image)}" alt="实际导出第 ${p.cue_id} 条 ${e(p.position||'')}"><button data-time="${p.time}">第 ${p.cue_id} 条 · ${p.time.toFixed(2)} 秒 ${e(p.position||'')}</button></div>`).join("");
function render(){const rows=d.cues.filter(c=>!$("issues").checked||!c.human_reviewed||c.pending||c.layout_review);$("cues").innerHTML=rows.map(c=>`<article><button data-time="${c.start}">第 ${c.id} 条 · ${c.start.toFixed(2)}–${c.end.toFixed(2)} 秒</button> <span class="tag">${c.human_reviewed?"已人工复核":"未复核"}</span>${c.pending?'<span class="tag">待核对</span>':""}${c.layout_review?'<span class="tag">检查布局</span>':""}${c.manual_edit?'<span class="tag">人工修改</span>':""}<p class="text">${e(c.text)}</p><p class="muted">原文：${e(c.original)}</p><p class="muted">位置：${e(c.position)} · 关联词：${e(c.bound_terms.join("、")||"无")}</p>${(c.segments||[]).length>1?`<p class="muted">${e(d.sampling_note)}</p><ul>${c.segments.map(v=>`<li><button data-time="${v.start}">${v.start.toFixed(2)}–${v.end.toFixed(2)} 秒 · ${e(v.position)}</button><br>${e(v.reason)} · 保护：${e(v.protected_labels.join("、")||"画面文字")}</li>`).join("")}</ul>`:""}${c.proposals.length?`<details><summary>纠词候选与画面依据</summary><ul>${c.proposals.map(p=>`<li>${e(p.from)} → ${e(p.to)} · ${e({pending:"待确认",accepted:"已采用",rejected:"保留原词"}[p.decision])}<br>${e(p.reason)}<br>${p.evidence.map(v=>e(v.time+" 秒："+v.text)).join("<br>")||"没有同时间画面文字，请听音确认。"}</li>`).join("")}</ul></details>`:""}</article>`).join("")||'<p>没有上述提示，可播放完整视频再次检查。</p>';}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-time]");if(b){$("player").currentTime=Number(b.dataset.time);$("player").play().catch(()=>{});$("player").scrollIntoView({behavior:"smooth",block:"center"});}});$("issues").addEventListener("change",render);render();
</script></body></html>

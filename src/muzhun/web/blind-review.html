<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕匿名测试</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5ef;color:#24362b;font:16px/1.7 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{margin:0}h2{font-size:21px}p{margin:10px 0}.notice{background:#fff3d4;padding:14px;border-radius:12px}article{background:white;border:1px solid #d7e2d4;border-radius:16px;padding:20px;margin:22px 0}video{width:100%;max-height:500px;background:#111;border-radius:10px}label{display:flex;flex-direction:column;gap:5px}input,select,textarea{min-width:0;width:100%;font:inherit;border:1px solid #bdcbbb;border-radius:8px;padding:8px;background:#fff}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:14px 0}.muted{color:#60705f;font-size:14px}button{background:#215b3c;color:white;border:0;border-radius:10px;padding:13px 22px;font:inherit;cursor:pointer}.sticky{position:sticky;bottom:0;background:#f3f5eff5;padding:15px 0;border-top:1px solid #d8e3d4}#message{display:inline-block;margin:8px}#demo{display:none}</style></head><body><main>
<h1>字幕匿名测试</h1><p id="batch" class="muted"></p><p>请先听清内容，确定正确术语和应该保持可见的区域，再按下面的顺序观看。三个片段使用相同原始素材。</p><p class="notice">没测过的项请留空。错词、误改、遮挡时间需要你判断；修改分钟数要实际计时。对字幕的满意度不能代替专业准确率。</p><p id="demo" class="notice">本批次是合成演示，用于练习测试流程。</p>
<p id="assisted" class="notice" hidden>本批次含人工修改或手动区域设置，测试的是辅助工作流程。纯自动算法对照需要未经修改的处理记录。</p><form id="form"><div class="fields"><label>测试者代号<input id="tester" maxlength="60" placeholder="不用填写真实姓名" required></label><label>对内容的熟悉程度<select id="familiarity" required><option value="">请选择</option><option>熟悉专业内容</option><option>有所了解</option><option>不熟悉，只评价观感</option></select></label></div><div id="clips"></div><div class="sticky"><button type="submit">下载我的评分 CSV</button><span id="message" role="status"></span><p class="muted">数据留在当前页面；下载 CSV 后发给作者。关闭页面前请下载。页面不连接外部服务。</p></div></form></main>
<script type="application/json" id="data">__MUZHUN_DATA__</script><script>
"use strict";const d=JSON.parse(document.getElementById("data").textContent),$=id=>document.getElementById(id),e=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const order=[...d.clips];for(let i=order.length-1;i>0;i--){const v=new Uint32Array(1);crypto.getRandomValues(v);const j=Math.floor(v[0]/4294967296*(i+1));[order[i],order[j]]=[order[j],order[i]];}
$("batch").textContent="批次 "+d.batch+" · 观看顺序已随机排列 · 评分后再揭示处理方法";if(d.demo)$("demo").style.display="block";$("assisted").hidden=!d.assisted;
const numeric=[["wrong","错词数量","1"],["false","误改数量","1"],["blocked","遮挡重点秒数","0.1"],["minutes","修改到可发布的分钟数","0.1"]];
$("clips").innerHTML=order.map((c,i)=>`<article data-name="${e(c.name)}"><h2>观看 ${i+1} · ${e(c.name)}</h2><video src="${e(c.file)}" controls playsinline preload="metadata"></video><div class="fields">${numeric.map(([k,n,step])=>`<label>${n}<input name="${k}" type="number" min="0" step="${step}" placeholder="未测请留空"></label>`).join("")}<label>清晰度<select name="clarity"><option value="">未评价</option><option value="1">1 很不清晰</option><option value="2">2</option><option value="3">3 一般</option><option value="4">4</option><option value="5">5 很清晰</option></select></label><label>愿否处理第二个视频<select name="reuse"><option value="">未评价</option><option>愿意</option><option>不确定</option><option>不愿意</option></select></label></div><label>具体问题 / 错词与时间<textarea name="note" rows="3" maxlength="1000" placeholder="例如：12 秒把人名改错了；20 秒挡住了参数。"></textarea></label></article>`).join("");
document.querySelectorAll("video").forEach(v=>v.addEventListener("play",()=>document.querySelectorAll("video").forEach(other=>{if(other!==v)other.pause();})));
function cell(value){let s=String(value??"");if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}
$("form").addEventListener("submit",ev=>{ev.preventDefault();const rows=[["批次","测试者","熟悉程度","观看序号","片段","错词数量","误改数量","遮挡重点秒数","修改到可发布的分钟数","清晰度1至5","愿否处理第二个视频","备注"]];document.querySelectorAll("article").forEach((a,i)=>rows.push([d.batch,$("tester").value,$("familiarity").value,i+1,a.dataset.name,...["wrong","false","blocked","minutes","clarity","reuse","note"].map(k=>a.querySelector(`[name="${k}"]`).value)]));const blob=new Blob(["\ufeff"+rows.map(r=>r.map(cell).join(",")).join("\r\n")+"\r\n"],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="字幕评分-"+d.batch+".csv";link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);$("message").textContent="评分 CSV 已生成，请保存后交给作者。";});
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幕准 · 音频与歌词</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/lyrics.css"></head>
<body>
<header class="topbar"><a class="brand" href="/">幕准<span>音频与歌词</span></a><nav class="nav-actions"><a class="text-button" href="/">视频字幕</a></nav></header>
<main class="lyrics-main">
  <section id="lyrics-welcome" class="welcome"><div class="welcome-heading"><h1>音频转字幕与歌词</h1><p>选择说话或歌曲，识别后试听编辑，导出 SRT / LRC。</p></div>
    <div class="upload-card"><form id="lyrics-form">
      <label class="dropzone"><input id="audio-input" name="audio" type="file" accept=".mp3,.wav,.m4a,.flac,.ogg,.opus,.aac,.mp4,.webm" required><strong id="audio-label">选择音频</strong><span>MP3、WAV、M4A 等 · 最大 512 MB / 2 小时</span></label>
      <div class="form-row"><label>音频内容<select name="content"><option value="song">歌曲 / 歌词</option><option value="speech">说话 / 课程 / 播客</option></select></label><label>识别质量<select name="model"><option value="small">均衡 · Small</option><option value="large-v3-turbo">精细 · Large v3 Turbo · 较慢</option><option value="base">快速试用 · Base</option><option value="medium">Medium</option></select></label></div>
      <details class="lyrics-input advanced"><summary>已有歌词或字幕（可选）</summary><label for="lyrics-text">歌词原文</label><textarea id="lyrics-text" name="lyrics" rows="7" placeholder="每行一句，副歌重复出现时也按演唱顺序写全。&#10;留空可自动识别正文。"></textarea><label class="file-text">或导入 TXT / LRC / SRT<input id="lyrics-file" type="file" accept=".txt,.lrc,.srt"></label></details>
      <details class="advanced"><summary>识别设置</summary><div class="form-row advanced-body"><label>语言<select name="language"><option value="auto">自动判断</option><option value="zh">中文</option><option value="en">英文</option><option value="ja">日文</option><option value="ko">韩文</option></select></label><label>术语 / 人名（每行一个，可选）<textarea name="glossary" rows="2" placeholder="LoRA&#10;PyTorch"></textarea></label><label>自动转录字形<select name="script"><option value="auto">中文用简体</option><option value="original">保留识别字形</option><option value="simplified">转为简体</option></select></label></div></details>
      <p class="small-note">已有 LRC / SRT 保留时间，不运行识别。TXT 对齐为实验功能；虚拟歌声、强伴奏可能漏识别，未匹配行需手动定位。</p><button id="lyrics-start" class="primary full" type="submit">识别并生成字幕</button>
    </form></div>
  </section>
  <section id="lyrics-progress" class="progress-panel hidden" aria-live="polite"><strong>正在处理音频</strong><progress id="lyrics-meter" max="1" value="0"></progress><p id="lyrics-message"></p><button id="lyrics-retry" class="secondary hidden">重试，复用已完成的识别片段</button></section>
  <section id="lyrics-workspace" class="hidden">
    <div class="workspace-heading"><h1 id="lyrics-title">歌词编辑</h1><div class="workspace-actions"><button id="lyrics-undo" class="secondary">撤销</button><button id="lyrics-redo" class="secondary">重做</button><button id="lyrics-new" class="secondary">新音频</button></div></div>
    <div class="audio-card"><audio id="audio-player" controls preload="metadata"></audio><p id="live-lyric" aria-live="off">—</p><canvas id="waveform" tabindex="0" aria-label="音频波形：点击定位，方向键微调播放时间"></canvas><div class="wave-controls"><span>点击波形定位 · 蓝色为本句</span><label>显示范围<select id="wave-span"><option value="10">10 秒</option><option value="30" selected>30 秒</option><option value="60">60 秒</option></select></label></div></div>
    <div class="lyrics-tools"><p id="lyrics-source" class="small-note"></p><button id="lyrics-simplify" class="text-button">文字转为简体</button></div>
    <details class="lyrics-realign"><summary>补充正确歌词 / 重新对齐</summary><label for="lyrics-realign-text">完整歌词</label><textarea id="lyrics-realign-text" rows="6" placeholder="每行一句，重复段落也按演唱顺序写全。"></textarea><label class="file-text">或导入 TXT / LRC / SRT<input id="lyrics-realign-file" type="file" accept=".txt,.lrc,.srt"></label><p id="lyrics-realign-note" class="small-note"></p><button id="lyrics-realign-apply" class="secondary">按新歌词重新对齐</button></details>
    <div class="lyrics-editor-grid">
      <div class="cue-card"><div class="card-heading"><h2 id="lines-heading">字幕与歌词</h2><span id="lyrics-summary" class="badge"></span></div><div class="cue-search"><input id="lyrics-search" type="search" placeholder="搜索文字" aria-label="搜索歌词"><select id="lyrics-filter" aria-label="筛选歌词"><option value="all">全部</option><option value="untimed">未定位</option><option value="unreviewed">未复核</option><option value="issues">对齐待检查</option></select></div><div id="lyrics-list" class="cue-list lyrics-list"></div></div>
      <aside class="inspector"><div class="inspector-section"><div class="card-heading"><h2>核对本句</h2><span id="lyric-number" class="badge"></span></div><label for="lyric-edit">歌词文字</label><textarea id="lyric-edit" rows="3"></textarea><p id="lyric-original" class="small-note"></p><p id="lyric-anchor" class="small-note"></p><div class="time-inputs"><label>开始（秒）<input id="lyric-start" type="number" step="0.001" min="0"></label><label>结束（秒）<input id="lyric-end" type="number" step="0.001" min="0"></label></div><div class="timing-actions"><button id="lyric-set-start" class="text-button">当前时间作起点</button><button id="lyric-set-end" class="text-button">当前时间作终点</button></div><button id="lyric-save" class="secondary full">保存修改</button><div class="review-actions"><button id="lyric-listen" class="secondary">试听本句</button><button id="lyric-review" class="secondary">标记已复核</button></div><button id="lyric-next" class="text-button">下一句待复核</button><details class="line-operations"><summary>拆分、合并与重新定位</summary><div class="timing-actions"><button id="lyric-split" class="secondary">在光标处拆句</button><button id="lyric-merge" class="secondary">合并下一句</button></div><button id="lyric-delete" class="text-button">删除本句（可撤销）</button><div class="time-inputs"><label>查找范围起点<input id="range-start" type="number" min="0" step=".1"></label><label>查找范围终点<input id="range-end" type="number" min="0" step=".1"></label></div><button id="lyric-range" class="secondary full">在这段音频中重新对齐本句</button></details><p id="lyric-issues" class="small-note"></p></div>
        <details class="inspector-section"><summary>整体提前 / 延后</summary><label>偏移（秒，正数延后）<input id="lyrics-offset" type="number" step="0.1" min="-60" max="60" value="0"></label><button id="lyrics-shift" class="secondary full">应用偏移</button></details>
        <div class="inspector-section export-section"><h2>导出</h2><a id="lyrics-lrc" class="primary full" download>下载 LRC</a><a id="lyrics-srt" class="secondary full" download>下载 SRT</a><a id="lyrics-report" class="small-link" download>处理记录 JSON</a><p id="lyrics-export-note" class="small-note"></p></div>
      </aside>
    </div>
  </section>
  <details class="history-section" id="lyrics-history-section"><summary>最近音频</summary><div id="lyrics-history" class="history-list"></div></details>
  <p id="lyrics-error" role="alert" class="notice hidden"></p>
</main><script src="/static/client.js"></script><script src="/static/waveform.js"></script><script src="/static/lyrics.js"></script></body></html>
